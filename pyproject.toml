[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comic_agent_studio"
version = "2.0.0"
description = "Local ChatGPT collaborative multi-agent comic studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.32.0,<1",
    "python-dotenv>=1.0.1,<2",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.5.0,<3",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "aiosqlite>=0.20.0,<1",
    "langgraph>=1.0.0,<2",
    "pillow>=11.0.0,<14",
    "httpx>=0.27.2,<1",
    "python-multipart>=0.0.18,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "black>=24.10.0"]
postgres = ["asyncpg>=0.29.0"]
legacy = ["redis>=5.1.1", "celery>=5.4.1", "minio>=7.2.0", "chromadb>=0.5.12"]

[project.scripts]
start = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "static/*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
